name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend and ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel pulls CUDA and blows the runner's disk.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r ml/requirements.txt -r backend/requirements.txt

      - name: Model tests
        working-directory: ml
        run: python -m pytest tests -q

      - name: API tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/ml
          JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key-000000
          JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key-00000
        run: python -m pytest tests -q

      - name: Migrations apply from an empty database
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/ml
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          python -m alembic upgrade head
          python -m app.seed

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Matches the Docker build: relative API base, served behind nginx.
          REACT_APP_API_URL: ""
          CI: "false" # warnings should not fail the build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile ./frontend
