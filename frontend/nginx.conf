server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is reached through this same origin, so the browser never makes a
    # cross-origin request and the refresh cookie needs no SameSite exemption.
    location ~ ^/(api|auth|health|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A first prediction loads the models; give it room before timing out.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be cached or a deploy
    # keeps serving the old app.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
